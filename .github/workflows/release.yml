name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-package:
    uses: ./.github/workflows/ci.yml
    with:
      upload-artifact: true

  attest:
    name: Attest package artifact
    needs: check-and-package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dsh-grid-panel-${{ github.sha }}
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: '*.tgz'
      # Attach the archive, the Sigstore bundle and its DSSE envelope to the
      # GitHub release, so downloads can be verified offline and OpenSSF
      # Scorecard finds signed release assets. See glsec/glsec#555.
      - name: Attach the package and its attestation to the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive=$(ls ./*.tgz)
          mv "$archive" "dsh-grid-panel-${version}.tgz"
          cp "${{ steps.attest.outputs.bundle-path }}" "dsh-grid-panel-${version}.sigstore.json"
          jq -c '.dsseEnvelope' "dsh-grid-panel-${version}.sigstore.json" > "dsh-grid-panel-${version}.intoto.jsonl"
          gh release create "$GITHUB_REF_NAME" --prerelease --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" \
            "dsh-grid-panel-${version}.tgz" \
            "dsh-grid-panel-${version}.sigstore.json" \
            "dsh-grid-panel-${version}.intoto.jsonl" \
            --clobber

  publish:
    name: Publish to npm
    needs: check-and-package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Trusted publishing (OIDC) requires npm 11.5.1 or later. The package
      # must be linked to this repository and workflow on npmjs.com first.
      - name: Update npm for trusted publishing
        run: npm install --global npm@latest
      - name: Download validated archive
        uses: actions/download-artifact@v8
        with:
          name: dsh-grid-panel-${{ github.sha }}
      # Staged publishing: the package is staged for later promotion instead
      # of going live immediately. Promote it on npmjs.com or with
      # `npm stage approve <id>`.
      - name: Stage the package with provenance
        run: npm stage publish ./*.tgz --provenance --access public
