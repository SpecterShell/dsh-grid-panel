name: Bug report / 问题反馈
description: Report a reproducible problem / 报告可复现的问题
body:
  - type: markdown
    attributes:
      value: |
        For security concerns, read the repository’s Security policy before sharing details.
        安全问题请先阅读安全政策，不要在公开 issue 中披露敏感信息。
  - type: textarea
    id: problem
    attributes:
      label: What happened? / 发生了什么？
      description: Describe the actual and expected behavior. / 请说明实际表现和预期行为。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include a minimal example and relevant plugin configuration. / 请提供最小示例和相关插件配置。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment / 环境
      description: Include plugin, DSH, Node.js and browser versions, OS, sidebar state and viewport size. / 请提供插件、DSH、Node.js、浏览器版本，以及操作系统、侧栏状态和窗口尺寸。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots / 日志或截图
      description: Remove tokens, private paths and session content. / 请删除令牌、私人路径和会话内容。
